<style>

  :root{
    --bg: #0d0f0a;
    --panel: #171a11;
    --line: #3a3d2c;
    --khaki: #b8bd8f;
    --khaki-dim: #7c7f61;
    --bone: #eef0e2;
    --amber: #e0a458;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background:
      radial-gradient(ellipse at 50% 20%, rgba(184,189,143,.06), transparent 60%),
      var(--bg);
    color: var(--bone);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
  }

  .grain{
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: .05; mix-blend-mode: overlay;
    background-image: repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px);
  }

  .error-container{
    text-align: center;
    max-width: 500px;
    position: relative;
    z-index: 2;
  }

  .parrot-gif{
    width: 200px;
    height: 200px;
    margin: 0 auto 40px;
  }

  .error-title{
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3rem);
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--bone);
    margin-bottom: 40px;
  }

  .btn-home{
    display: inline-block;
    font-family: var(--font-mono);
    font-size: .76rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #14150e;
    background: var(--amber);
    border: 1px solid var(--amber);
    padding: 14px 32px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity .2s;
  }

  .btn-home:hover{
    opacity: .85;
  }
</style>
</head>
